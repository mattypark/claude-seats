# Change prefix from Ctrl-b to Option-j (Meta-j)
unbind C-b
set -g prefix M-j
bind M-j send-prefix

# Enable mouse support (scrolling, clicking panes, etc.)
set -g mouse on

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ── A second prefix for a phone keyboard over SSH ──
# Second prefix: Ctrl-b (easier than Option-j on iPhone keyboard)
set -g prefix2 C-b
bind -n C-b send-prefix -2

# Windows/panes numbered from 1 (match "terminal 1..4")
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Big scrollback for long Claude sessions
set -g history-limit 50000

# Truecolor for Claude Code UI
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar: clear tap targets for windows 1-4
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[bold,fg=colour114] #S "
set -g status-right "#[fg=colour245]%b %d %H:%M "
setw -g window-status-format "  #I:#W  "
setw -g window-status-current-format "#[bold,bg=colour114,fg=colour235]  #I:#W  "

# Quad layout: prefix + q tiles all panes in current window 2x2
unbind q
bind q select-layout tiled

# Quick window jumps already work: prefix + 1/2/3/4
# New terminal: prefix + c   Detach: prefix + d

# Two clients (Mac + phone) on different screen sizes: only shrink to the
# smaller client on windows both are actually viewing.
setw -g aggressive-resize on

# prefix + s = session picker (how the phone finds Mac-started `cc` sessions)

# ── Phone: live pane list ────────────────────────────────────
# The phone only ever saw ONE entry because all 8 Claudes are PANES inside a
# single window, and tmux's status bar lists WINDOWS. Second status row below
# lists every pane in the current window, so the phone sees all of them.

# Refresh fast so the list is never stale after closing/opening a terminal.
set -g status-interval 2

# Two status rows: row 0 = windows (built-in), row 1 = panes of current window.
set -g status 2
# Narrow clients (phone) get index-only chips so all 8 still fit on one row;
# wide clients (Mac) get the full pane title.
set -g status-format[1] "#[bg=colour235]#{P:#{?pane_active,#[bold bg=colour114 fg=colour235],#[bg=colour238 fg=colour250]} #{pane_index}#{?#{>:#{client_width},100},:#{=14:pane_title},} #[bg=colour235] }"

# Pane border titles are OFF — they cost a text row per pane on the Mac grid.
set -g pane-border-status off

# ── Phone: one terminal at a time ────────────────────────────
# tmux sizes a window to its clients, so a pane cannot be full-screen on the
# phone and gridded on the Mac at the same instant. Zoom is the lever:
#   Alt-1 .. Alt-8  jump to that Claude AND zoom it full-screen
#   Alt-0           unzoom, back to the 8-up grid
# Termius has `alt` on its accessory bar, so this needs no prefix on the phone.
# On the Mac, Alt-0 restores the grid.
bind -n M-0 resize-pane -Z
bind -n M-1 select-pane -t 1 \; resize-pane -Z
bind -n M-2 select-pane -t 2 \; resize-pane -Z
bind -n M-3 select-pane -t 3 \; resize-pane -Z
bind -n M-4 select-pane -t 4 \; resize-pane -Z
bind -n M-5 select-pane -t 5 \; resize-pane -Z
bind -n M-6 select-pane -t 6 \; resize-pane -Z
bind -n M-7 select-pane -t 7 \; resize-pane -Z
bind -n M-8 select-pane -t 8 \; resize-pane -Z

# Window entries show their live pane count: "1:zsh(8)"
setw -g window-status-format "  #I:#W(#{window_panes})  "
setw -g window-status-current-format "#[bold,bg=colour114,fg=colour235]  #I:#W(#{window_panes})  "

# prefix + e = big pane numbers overlay; type the number to jump. 5s to tap.
set -g display-panes-time 5000
bind e display-panes

# ── Per-pane colours ─────────────────────────────────────────
# ~/bin/paint assigns each pane its own background, text and border colour
# (window-style is a PANE option, so backgrounds really are per-pane).
# GUI editor: run `paintbox`. Saved themes: ~/.config/paint/themes.json
set-hook -g after-split-window 'run-shell -b "~/bin/paint auto"'
set-hook -g after-kill-pane    'run-shell -b "~/bin/paint auto"'
bind P run-shell -b "~/bin/paint auto"

# ── Closing the tab ends the session (Matthew, 2026-10-01) ──
# Closing a Terminal tab only detaches tmux, so every Claude in it kept running
# out of sight. Once a session has had a client, it now ends when the last one
# leaves: closing the tab, prefix d, or Termius being the last one out.
# Terminal asks first (Settings → Profiles → Shell → Ask before closing: Always).
# Sessions made with `new-session -d` (dev-layout.sh) live until first attached.
set-hook -g client-attached 'set-option destroy-unattached on'
